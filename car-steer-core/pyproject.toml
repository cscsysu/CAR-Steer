[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car-steer"
version = "0.1.0"
description = "Curvature-Adaptive Recall Steering: core inference implementation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.4,<2.7",
  "transformers==4.51.2",
  "numpy>=1.24,<2",
  "sentencepiece>=0.2,<0.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
car-steer = "car_steer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
